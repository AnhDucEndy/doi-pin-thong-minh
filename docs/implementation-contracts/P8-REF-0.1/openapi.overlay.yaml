        amount_minor:
          type: integer
          minimum: 1
        currency:
          const: VND
        attempt_id:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 0
        protocol_version:
          const: P8-REF-0.1
        message_kind:
          const: ATTEMPT_RESULT
        provider_reference:
          type: string
          minLength: 1
        result:
          type: string
          enum:
          - PENDING
          - UNKNOWN
          - FAILED
          - SUCCEEDED
        phase:
          type: string
          enum:
          - RESERVED
          - PREPARED
          - UNKNOWN
          - FINAL
        effect_count:
          type: integer
          minimum: 0
          maximum: 1
        no_effect_receipt:
          $ref: '#/components/schemas/P8RFNoEffectReceipt'
        permit_id:
          type: string
          format: uuid
      required:
      - payment_id
      - refund_id
      - provider_key
      - original_provider_reference
      - amount_minor
      - currency
      - attempt_id
      - generation
      - protocol_version
      - message_kind
      - provider_reference
      - result
      - phase
      - effect_count
      allOf:
      - if:
          properties:
            result:
              const: SUCCEEDED
          required:
          - result
        then:
          properties:
            effect_count:
              const: 1
            phase:
              const: FINAL
      - if:
          properties:
            result:
              const: FAILED
          required:
          - result
        then:
          properties:
            effect_count:
              const: 0
            phase:
              const: FINAL
          required:
          - no_effect_receipt
      - if:
          properties:
            result:
              const: PENDING
          required:
          - result
        then:
          properties:
            effect_count:
              const: 0
            phase:
              const: PREPARED
      - if:
          properties:
            phase:
              const: RESERVED
          required:
          - phase
        then:
          properties:
            result:
              const: UNKNOWN
            effect_count:
              const: 0
      - if:
          properties:
            phase:
              const: UNKNOWN
          required:
          - phase
        then:
          properties:
            result:
              const: UNKNOWN
      - if:
          properties:
            phase:
              const: FINAL
          required:
          - phase
        then:
          properties:
            result:
              enum:
              - SUCCEEDED
              - FAILED
