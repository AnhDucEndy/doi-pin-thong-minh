        '503':
          description: Trạm offline hoặc dịch vụ chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - PaymentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PaymentCallback'
              - $ref: '#/components/schemas/P8RFRefundCallback'
      x-contract-version: P8-REF-0.1
  /mock/v1/refunds:
    post:
      operationId: providerRefund
      summary: Mock tạo khoản hoàn
      description: Một intent, cùng key; chỉ full refund không quá khoản thu; ledger
        tồn tại qua restart.
      tags:
      - FR16
      x-roles:
      - BACKEND
      x-fr:
      - FR16
      x-uc:
      - UC14
      responses:
        '202':
          description: Mock tạo khoản hoàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P8RFProviderResponse'
        '400':
          description: Yêu cầu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực
          content:
