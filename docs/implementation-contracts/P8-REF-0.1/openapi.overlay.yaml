components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      description: Opaque web session; server lưu hash; role/scope kiểm tra mỗi request.
    DeviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
    PaymentKey:
      type: apiKey
      in: header
      name: X-Payment-Key
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  schemas:
    Role:
      type: string
      enum:
      - ADMIN
      - CUSTOMER
      - TECHNICIAN
    AccountState:
      type: string
      enum:
      - ACTIVE
      - LOCKED
      - INACTIVE
    StationState:
      type: string
      enum:
      - ACTIVE
      - MAINTENANCE
      - INACTIVE
    BatteryState:
      type: string
      enum:
      - REGISTERED
      - IN_SERVICE
      - QUARANTINED
      - RETIRED
    LocationKind:
      type: string
      enum:
      - COMPARTMENT
      - CUSTOMER
      - UNKNOWN
    CompartmentState:
      type: string
      enum:
      - ACTIVE
      - BLOCKED
      - MAINTENANCE
      - RETIRED
    DoorState:
      type: string
      enum:
      - UNKNOWN
      - CLOSED
      - OPEN
    SwapState:
      type: string
      enum:
      - VERIFIED
      - RESERVED
      - AWAITING_PAYMENT
      - AWAITING_RETURN
      - RETURN_ACCEPTED
      - AWAITING_PICKUP
      - REVIEW_REQUIRED
      - COMPENSATING
      - COMPLETED
      - CANCELLED
      - CLOSED_COMPENSATED
    PaymentState:
      type: string
      enum:
      - CREATED
      - PENDING
      - UNKNOWN
      - SUCCEEDED
      - FAILED
    RefundState:
      type: string
      enum:
      - REQUESTED
      - PENDING
      - UNKNOWN
      - SUCCEEDED
      - FAILED
    CommandState:
      type: string
      enum:
      - QUEUED
      - DISPATCHED
      - ACKNOWLEDGED
      - OBSERVED
      - REJECTED
      - EXPIRED
      - UNKNOWN
    AlertState:
      type: string
      enum:
      - OPEN
      - ACKNOWLEDGED
      - RESOLVED
    CaseState:
      type: string
      enum:
      - OPEN
      - EVIDENCE_RECORDED
      - RESOLVED
    CredentialKind:
      type: string
      enum:
      - RFID
    CommandKind:
      type: string
      enum:
      - OPEN_RETURN
      - OPEN_SUPPLY
    EventKind:
      type: string
      enum:
      - HEARTBEAT
      - TELEMETRY
      - DOOR
      - PRESENCE
      - COMMAND_ACK
      - SNAPSHOT
      - FAULT
    Users:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        username:
          type: string
          description: Tên đăng nhập chuẩn hóa lowercase
        role:
          $ref: '#/components/schemas/Role'
          description: Không kế thừa ADMIN → TECHNICIAN
        state:
          $ref: '#/components/schemas/AccountState'
          description: Khóa/ngừng tài khoản không xóa lịch sử
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - username
      - role
      - state
      - version
      - created_at
    Stations:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        code:
          type: string
          description: Mã trạm
        name:
          type: string
          description: Tên
        address:
          type: string
          description: Địa chỉ hiển thị
        state:
          $ref: '#/components/schemas/StationState'
          description: Trạng thái hành chính; online tính riêng
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - code
      - name
      - address
      - state
      - version
      - created_at
    Devices:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        station_id:
          type: string
          format: uuid
          description: MVP một bộ điều khiển hiện hành mỗi trạm
        serial:
          type: string
          description: Mã thiết bị
        enabled:
          type: boolean
          description: Vô hiệu hóa danh tính
        last_received_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Heartbeat gần nhất được chấp nhận
        boot_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Phiên khởi động hiện hành
        last_seq:
          type: integer
          description: Sequence lớn nhất trong boot hiện hành
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - station_id
      - serial
      - enabled
      - last_received_at
      - boot_id
      - last_seq
      - version
      - created_at
    Compartments:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        station_id:
          type: string
          format: uuid
          description: Thuộc trạm
        slot_no:
          type: integer
          description: Số ngăn
        service_state:
          $ref: '#/components/schemas/CompartmentState'
          description: Ban đầu chặn tới khi có snapshot
        door_state:
          $ref: '#/components/schemas/DoorState'
          description: Trạng thái cửa độc lập trạng thái phục vụ
        observed_present:
          anyOf:
          - type: boolean
          - type: 'null'
          description: NULL nếu chưa biết có pin
        observed_serial:
          anyOf:
          - type: string
          - type: 'null'
          description: Giữ mã quan sát kể cả không nhận diện được
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Thời gian Backend nhận quan sát hợp lệ
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - station_id
      - slot_no
      - service_state
      - door_state
      - observed_present
      - observed_serial
      - observed_at
      - version
      - created_at
    Batteries:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        serial:
          type: string
          description: Mã pin trong mạng lưới
        family:
          type: string
          description: Họ pin duy nhất trong demo, vẫn lưu để kiểm tra
        lifecycle:
