        '503':
          description: Trạm offline hoặc dịch vụ chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: 'Baseline mode unchanged. Tagged ATTEMPT_REFUND: attempt_id;
          REQUEST_RETRY_PERMISSION: reconcile_request_id. provider_key remains immutable
          intent identity.'
      - name: X-Refund-Protocol
        in: header
        required: false
        schema:
          const: P8-REF-0.1
        description: 'Absent: unchanged baseline. Required for tagged command/query;
          semantic cross-check required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/P8RFProviderRefundCommand'
      servers:
      - url: http://localhost:8001
        description: Payment mock độc lập, chỉ Backend gọi
      x-contract-version: P8-REF-0.1
  /mock/v1/refunds/{provider_key}:
