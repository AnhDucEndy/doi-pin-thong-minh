openapi: 3.1.0
info:
  title: P8-REF-0.1 additive design overlay — NOT IMPLEMENTED
  version: '0.1'
x-base-sha256: 8a85c8ab906a106ab631a43faeaa040a699f1332a81245d5b497aed89f69a808
paths:
  /v1/payments/{payment_id}/refund:
    post:
      operationId: requestRefund
      summary: Yêu cầu hoàn phí có kiểm chứng
      description: Guard BR08/09 và INVARIANTS.md; payment SUCCEEDED, chắc chắn chưa
        giao pin mới, không lệnh còn có thể tác động. Refund full amount từ DB, không
        do client quyết định.
      tags:
      - FR16
      x-roles:
      - ADMIN
      x-fr:
      - FR16
      x-uc:
      - UC14
      responses:
        '202':
          description: Yêu cầu hoàn phí có kiểm chứng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refunds'
        '400':
          description: Yêu cầu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền/phạm vi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không thấy tài nguyên hoặc bị ẩn vì khác chủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột state/version/idempotency/tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Dữ liệu sai schema hoặc thiếu cấu hình demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Vượt giới hạn thử sai/tốc độ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Trạm offline hoặc dịch vụ chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - UserBearer: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Cùng principal+route+key+body trả kết quả cũ; khác body trả 409.
          HTTP key không thay command/provider key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonAction'
      x-contract-version: P8-REF-0.1
    get:
      operationId: getRefund
      summary: Xem khoản hoàn
      description: Khách chỉ payment của mình; 404 khi chưa có refund.
      tags:
      - FR16
      x-roles:
      - ADMIN
      - CUSTOMER
      x-fr:
      - FR16
      x-uc:
      - UC14
      responses:
        '200':
          description: Xem khoản hoàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refunds'
        '400':
          description: Yêu cầu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền/phạm vi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không thấy tài nguyên hoặc bị ẩn vì khác chủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột state/version/idempotency/tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Dữ liệu sai schema hoặc thiếu cấu hình demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Vượt giới hạn thử sai/tốc độ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Trạm offline hoặc dịch vụ chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - UserBearer: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-contract-version: P8-REF-0.1
