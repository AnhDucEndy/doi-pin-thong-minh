      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonAction'
      x-contract-version: P8-REF-0.1
  /v1/payment-events:
    post:
      operationId: receivePaymentEvent
      summary: Nhận callback thu hoặc hoàn
      description: Xác minh X-Payment-Key qua HTTPS/private mock, mã/tiền/currency.
        Cùng event ID khác hash =409. Callback chỉ được inbox sau xác minh; không
        cho trình duyệt tự xác nhận trả tiền.
      tags:
      - FR14
      x-roles:
      - PAYMENT
      x-fr:
      - FR14
      - FR15
      - FR16
      x-uc:
      - UC12
      - UC13
      - UC14
      responses:
        '202':
          description: Nhận callback thu hoặc hoàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackReceipt'
        '400':
          description: Yêu cầu sai
          content:
