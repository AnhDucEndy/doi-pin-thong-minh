openapi: 3.1.0
info:
  title: P8-REC-0.3 additive dispatch branches — NOT IMPLEMENTED
  version: '0.3'
x-composition: Union branches with existing 0.1/0.2 operations; never replace legacy
  inputs or security. See README.
paths:
  /v1/swaps/{swap_id}/recovery/evidence:
    post:
      operationId: recordRecoveryEvidence
      x-roles:
      - TECHNICIAN
      x-contract-version: P8-REC-0.3
      security:
      - UserBearer: []
      parameters:
      - name: swap_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/P8NDBeginRequest'
              - $ref: '#/components/schemas/P8NDTechnicianAttestation'
              - $ref: '#/components/schemas/P8NDDecideRequest'
      responses:
        '200':
          description: Accepted versioned operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P8NDNoDeliveryResponse'
        '401':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/swaps/{swap_id}/recovery/confirmations:
    post:
      operationId: confirmRecovery
      x-roles:
      - CUSTOMER
      x-contract-version: P8-REC-0.3
      security:
      - UserBearer: []
      parameters:
      - name: swap_id
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/P8NDCustomerConfirmation'
      responses:
        '201':
          description: Accepted versioned operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id: *id001
                  operation_id: *id001
                  accepted:
                    const: true
                  confirmed:
                    type: boolean
                required:
                - id
                - operation_id
                - accepted
                - confirmed
        '401':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/device/recovery-observations:
    post:
      operationId: receiveRecoveryObservation
      x-roles:
      - DEVICE
      x-contract-version: P8-REC-0.3
      security:
      - DeviceKey: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/P8NDObservation'
      responses:
        '202':
          description: Accepted versioned operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id: *id001
                  accepted:
                    const: true
                  duplicate:
                    type: boolean
                required:
                - id
                - accepted
                - duplicate
        '401':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Baseline or versioned guard refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/swaps/{swap_id}/recovery:
    get:
      operationId: getRecovery
      x-roles:
      - ADMIN
      - TECHNICIAN
      security:
      - UserBearer: []
      x-contract-version: P8-REC-0.3
      parameters:
      - name: swap_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Version 0.3 response branch, union with old branches on composition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P8NDNoDeliveryResponse'
  /v1/device/recovery-tasks:
    get:
      operationId: pollRecoveryTasks
      x-roles:
      - DEVICE
      security:
      - DeviceKey: []
      x-contract-version: P8-REC-0.3
      parameters: []
      responses:
        '200':
          description: Version 0.3 response branch, union with old branches on composition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P8NDTaskList'
components:
  schemas:
    Role:
      type: string
      enum:
      - ADMIN
      - CUSTOMER
      - TECHNICIAN
    AccountState:
      type: string
      enum:
      - ACTIVE
      - LOCKED
      - INACTIVE
    StationState:
      type: string
      enum:
      - ACTIVE
      - MAINTENANCE
      - INACTIVE
    BatteryState:
      type: string
      enum:
      - REGISTERED
      - IN_SERVICE
      - QUARANTINED
      - RETIRED
    LocationKind:
      type: string
      enum:
      - COMPARTMENT
      - CUSTOMER
      - UNKNOWN
    CompartmentState:
      type: string
      enum:
      - ACTIVE
      - BLOCKED
      - MAINTENANCE
      - RETIRED
    DoorState:
      type: string
      enum:
      - UNKNOWN
      - CLOSED
      - OPEN
    SwapState:
      type: string
      enum:
      - VERIFIED
      - RESERVED
      - AWAITING_PAYMENT
      - AWAITING_RETURN
      - RETURN_ACCEPTED
      - AWAITING_PICKUP
      - REVIEW_REQUIRED
      - COMPENSATING
      - COMPLETED
      - CANCELLED
      - CLOSED_COMPENSATED
    PaymentState:
      type: string
      enum:
      - CREATED
      - PENDING
      - UNKNOWN
      - SUCCEEDED
      - FAILED
    RefundState:
      type: string
      enum:
      - REQUESTED
      - PENDING
      - UNKNOWN
      - SUCCEEDED
      - FAILED
    CommandState:
      type: string
      enum:
      - QUEUED
      - DISPATCHED
      - ACKNOWLEDGED
      - OBSERVED
      - REJECTED
      - EXPIRED
      - UNKNOWN
    AlertState:
      type: string
      enum:
      - OPEN
      - ACKNOWLEDGED
      - RESOLVED
    CaseState:
      type: string
      enum:
      - OPEN
      - EVIDENCE_RECORDED
      - RESOLVED
    CredentialKind:
      type: string
      enum:
      - RFID
    CommandKind:
      type: string
      enum:
      - OPEN_RETURN
      - OPEN_SUPPLY
    EventKind:
      type: string
      enum:
      - HEARTBEAT
      - TELEMETRY
      - DOOR
      - PRESENCE
      - COMMAND_ACK
      - SNAPSHOT
      - FAULT
    Users:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        username:
          type: string
          description: Tên đăng nhập chuẩn hóa lowercase
        role:
          $ref: '#/components/schemas/Role'
          description: Không kế thừa ADMIN → TECHNICIAN
        state:
          $ref: '#/components/schemas/AccountState'
          description: Khóa/ngừng tài khoản không xóa lịch sử
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - username
      - role
      - state
      - version
      - created_at
    Stations:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        code:
          type: string
          description: Mã trạm
        name:
          type: string
          description: Tên
        address:
          type: string
          description: Địa chỉ hiển thị
        state:
          $ref: '#/components/schemas/StationState'
          description: Trạng thái hành chính; online tính riêng
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - code
      - name
      - address
      - state
      - version
      - created_at
    Devices:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        station_id:
          type: string
          format: uuid
          description: MVP một bộ điều khiển hiện hành mỗi trạm
        serial:
          type: string
          description: Mã thiết bị
        enabled:
          type: boolean
          description: Vô hiệu hóa danh tính
        last_received_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Heartbeat gần nhất được chấp nhận
        boot_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Phiên khởi động hiện hành
        last_seq:
          type: integer
          description: Sequence lớn nhất trong boot hiện hành
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - station_id
      - serial
      - enabled
      - last_received_at
      - boot_id
      - last_seq
      - version
      - created_at
    Compartments:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        station_id:
          type: string
          format: uuid
          description: Thuộc trạm
        slot_no:
          type: integer
          description: Số ngăn
        service_state:
          $ref: '#/components/schemas/CompartmentState'
          description: Ban đầu chặn tới khi có snapshot
        door_state:
          $ref: '#/components/schemas/DoorState'
          description: Trạng thái cửa độc lập trạng thái phục vụ
        observed_present:
          anyOf:
          - type: boolean
          - type: 'null'
          description: NULL nếu chưa biết có pin
        observed_serial:
          anyOf:
          - type: string
          - type: 'null'
          description: Giữ mã quan sát kể cả không nhận diện được
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Thời gian Backend nhận quan sát hợp lệ
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - station_id
      - slot_no
      - service_state
      - door_state
      - observed_present
      - observed_serial
      - observed_at
      - version
      - created_at
    Batteries:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        serial:
          type: string
          description: Mã pin trong mạng lưới
        family:
          type: string
          description: Họ pin duy nhất trong demo, vẫn lưu để kiểm tra
        lifecycle:
          $ref: '#/components/schemas/BatteryState'
          description: Vòng đời quản lý không đồng nhất SOC
        location_kind:
          $ref: '#/components/schemas/LocationKind'
          description: Vị trí đã xác minh
        compartment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Ngăn khi location=COMPARTMENT
        holder_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Khách giữ khi location=CUSTOMER
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - serial
      - family
      - lifecycle
      - location_kind
      - compartment_id
      - holder_user_id
      - version
      - created_at
    SwapTransactions:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        customer_id:
          type: string
          format: uuid
          description: Khách hàng
        station_id:
          type: string
          format: uuid
          description: Trạm
        verified_via:
          type: string
          description: Phương thức xác thực
        state:
          $ref: '#/components/schemas/SwapState'
          description: Trạng thái nghiệp vụ
        policy_id:
          type: string
          format: uuid
          description: Phiên bản chính sách
        old_battery_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Pin khách phải trả, xác định khi giữ tài nguyên
        new_battery_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Pin được giữ để cấp
        return_compartment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Ngăn nhận
        supply_compartment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Ngăn cấp
        amount_minor:
          anyOf:
          - type: integer
          - type: 'null'
          description: Phí VND nguyên, chốt khi reserve
        currency:
          type: string
          description: Demo chỉ VND
        consented_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Chấp thuận phí trước yêu cầu thu
        reservation_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Chỉ tự hết hạn khi RESERVED chưa gửi thu
        return_observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Bằng chứng nhận pin cũ + cửa đóng
        pickup_observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Bằng chứng lấy pin mới + cửa đóng
        review_reason:
          anyOf:
          - type: string
          - type: 'null'
          description: Lý do chờ xử lý
        closed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Thời điểm trạng thái kết thúc
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - customer_id
      - station_id
      - verified_via
      - state
      - policy_id
      - old_battery_id
      - new_battery_id
      - return_compartment_id
      - supply_compartment_id
      - amount_minor
      - currency
      - consented_at
      - reservation_expires_at
      - return_observed_at
      - pickup_observed_at
      - review_reason
      - closed_at
      - version
      - created_at
    Payments:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        swap_id:
          type: string
          format: uuid
          description: Một intent/phiên; thất bại chắc chắn kết thúc phiên
        provider_key:
          type: string
          format: uuid
          description: Idempotency key khi gọi mock
        provider_reference:
          anyOf:
          - type: string
          - type: 'null'
          description: Mã phía mock
        state:
          $ref: '#/components/schemas/PaymentState'
          description: Trạng thái thu độc lập
        amount_minor:
          type: integer
          description: Phải bằng phí phiên
        currency:
          type: string
          description: Đơn vị
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Khi đã xác minh kết quả
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - swap_id
      - provider_key
      - provider_reference
      - state
      - amount_minor
      - currency
      - verified_at
      - version
      - created_at
    Refunds:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        payment_id:
          type: string
          format: uuid
          description: Một refund intent cho khoản thu, retry cùng khóa
        requested_by:
          type: string
          format: uuid
          description: Admin; service kiểm tra role
        provider_key:
          type: string
          format: uuid
          description: Idempotency key hoàn
        provider_reference:
          anyOf:
          - type: string
          - type: 'null'
          description: Mã hoàn bên mock
        state:
          $ref: '#/components/schemas/RefundState'
          description: Lỗi/UNKNOWN không được tạo intent mới
        amount_minor:
          type: integer
          description: MVP bằng toàn bộ khoản thu
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Xác minh hoàn
        reason:
          type: string
          description: Lý do và kết quả đối soát
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - payment_id
      - requested_by
      - provider_key
      - provider_reference
      - state
      - amount_minor
      - verified_at
      - reason
      - version
      - created_at
    Alerts:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        station_id:
          type: string
          format: uuid
          description: Trạm
        battery_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Pin liên quan
        compartment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Ngăn liên quan
        dedup_key:
          type: string
          description: Loại lỗi + tài nguyên, phạm vi trạm
        code:
          type: string
          description: Mã lỗi ổn định
        state:
          $ref: '#/components/schemas/AlertState'
          description: ACK không gỡ chặn
        last_event_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Bằng chứng gần nhất
        acknowledged_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Kỹ thuật viên được giao
        resolved_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Kỹ thuật viên
        resolution_note:
          anyOf:
          - type: string
          - type: 'null'
          description: Bằng chứng hết lỗi
        occurrences:
          type: integer
          description: Số lần báo
        version:
          type: integer
          description: Khóa lạc quan; tăng sau mỗi cập nhật nghiệp vụ
        created_at:
          type: string
          format: date-time
          description: Thời điểm tạo UTC
      required:
      - id
      - station_id
      - battery_id
      - compartment_id
      - dedup_key
      - code
      - state
      - last_event_id
      - acknowledged_by
      - resolved_by
      - resolution_note
      - occurrences
      - version
      - created_at
    RecoveryCases:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Định danh UUID do ứng dụng sinh
        swap_id:
          type: string
          format: uuid
          description: Một hồ sơ theo phiên
        state:
          $ref: '#/components/schemas/CaseState'
          description: Tình trạng
        assigned_to:
          anyOf:
