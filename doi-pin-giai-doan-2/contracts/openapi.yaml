openapi: 3.1.0
info:
  title: Smart Battery Swap GD2 contract
  version: 0.2.0-draft
  description: Thiết kế dựa GD1; chưa triển khai. x-roles, x-fr, x-uc là ràng buộc
    Backend bắt buộc; OpenAPI tự nó không thực thi phân quyền. Không có endpoint sửa
    state trực tiếp.
servers:
- url: http://localhost:8000
  description: Chỉ demo loopback; triển khai từ xa phải HTTPS
security:
- UserBearer: []
paths:
  /v1/auth/login:
    post:
      operationId: login
      summary: Đăng nhập
      description: Backend giới hạn thử sai theo NFR02; tài khoản khóa không cấp token.
        Không tiết lộ tài khoản có tồn tại.
      tags:
      - FR01
      x-roles: &id001
      - ADMIN
      - CUSTOMER
      - TECHNICIAN
      x-fr:
      - FR01
      x-uc:
      - UC01
      responses:
        '200':
          description: Đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Yêu cầu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không có quyền/phạm vi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không thấy tài nguyên hoặc bị ẩn vì khác chủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột state/version/idempotency/tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Dữ liệu sai schema hoặc thiếu cấu hình demo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Vượt giới hạn thử sai/tốc độ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Trạm offline hoặc dịch vụ chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
